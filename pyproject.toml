[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck-cli"
version = "0.1.1"
description = "Zero-dependency static analyzer that catches AI-generated phantom stubs, cloned logic, swallowed errors, and hallucinated imports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["linter", "static-analysis", "ast", "code-quality", "ai-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
vibecheck = "vibecheck.cli:main"

[tool.setuptools.packages.find]
include = ["vibecheck*"]

[tool.vibecheck]
ignore = ["tests/**"]
