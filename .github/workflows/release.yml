name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests and self-scan
        run: |
          python -m unittest discover -s tests -v
          python -m vibecheck . --no-color --fail-on info

      - name: Build vibecheck Windows bundles
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --onedir --noconsole --clean --name vibecheck vibecheck/__main__.py
          Compress-Archive -Path dist/vibecheck/* -DestinationPath dist/vibecheck-windows-x64.zip
          python -m PyInstaller --onefile --noconsole --clean --name vibecheck vibecheck/__main__.py

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vibecheck-windows-x64.zip
            dist/vibecheck.exe
